# ==========================================================================
# WBA — Netlify configuration
#
# Headers only, deliberately. There is no [build] block: the publish
# directory is already set in the Netlify dashboard, and a build command
# here would override it. The Feed is generated by GitHub Actions and
# committed to the repo, so Netlify has nothing to build — it just serves.
# ==========================================================================

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"

# Photos are content-addressed by name and never change in place.
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS and JS are cache-busted with a content hash by scripts/build-feed.mjs
# (see stampAssets), so a changed file is always a changed URL. That makes a
# long cache safe AND correct. Without the stamp this header is a trap: the
# HTML is max-age=0, so returning visitors would pair new markup with a
# week-old stylesheet and every new component would render unstyled.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# --------------------------------------------------------------------------
# A Content-Security-Policy that matches everything this site actually loads.
# Left commented out on purpose: switch it on once, then click through every
# page and watch the browser console. A wrong CSP fails silently.
#
# [[headers]]
#   for = "/*"
#   [headers.values]
#     Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://lynzhiyvggqyplssrapi.supabase.co; connect-src 'self' https://lynzhiyvggqyplssrapi.supabase.co https://formspree.io; frame-ancestors 'self'"
# --------------------------------------------------------------------------

# The command palette's index. It changes whenever a Feed post is published,
# and unlike CSS and JS its URL has no content hash to bust — palette.js asks
# for a fixed path. Ten minutes is long enough that repeat visitors in one
# session never re-fetch it, and short enough that a new article is findable
# almost immediately.
[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=600"
