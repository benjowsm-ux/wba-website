# ==========================================================================
# WBA — Netlify configuration
#
# Headers only, deliberately. There is no [build] block: the publish
# directory is already set in the Netlify dashboard, and a build command
# here would override it. The Feed is generated by GitHub Actions and
# committed to the repo, so Netlify has nothing to build — it just serves.
# ==========================================================================

# --------------------------------------------------------------------------
# Functions. There is still no [build] block on purpose — the publish
# directory is set in the Netlify dashboard and a build command here would
# override it. This only tells Netlify where the functions are, which it does
# not reliably infer on a site that has never had any.
# --------------------------------------------------------------------------
# The route for the preview edge function is declared INSIDE
# netlify/edge-functions/preview.js via `export const config`. Declaring it
# here as well did not route, and having it in two places makes it unclear
# which one is authoritative when it stops working.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"

# Photos are content-addressed by name and never change in place.
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS and JS are cache-busted with a content hash by scripts/build-feed.mjs
# (see stampAssets), so a changed file is always a changed URL. That makes a
# long cache safe AND correct. Without the stamp this header is a trap: the
# HTML is max-age=0, so returning visitors would pair new markup with a
# week-old stylesheet and every new component would render unstyled.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# --------------------------------------------------------------------------
# A Content-Security-Policy that matches everything this site actually loads.
# Left commented out on purpose: switch it on once, then click through every
# page and watch the browser console. A wrong CSP fails silently.
#
# [[headers]]
#   for = "/*"
#   [headers.values]
#     Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://lynzhiyvggqyplssrapi.supabase.co; connect-src 'self' https://lynzhiyvggqyplssrapi.supabase.co https://formspree.io; frame-ancestors 'self'"
# --------------------------------------------------------------------------

# The command palette's index. It changes whenever a Feed post is published,
# and unlike CSS and JS its URL has no content hash to bust — palette.js asks
# for a fixed path. Ten minutes is long enough that repeat visitors in one
# session never re-fetch it, and short enough that a new article is findable
# almost immediately.
[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=600"

# The portal's handle→code endpoint. Proxied (status 200, not a 301) so the
# browser sees it as same-origin: no CORS preflight, and no Supabase project
# URL in the page for someone to poke at directly.
[[redirects]]
  from = "/api/portal-login"
  to = "https://lynzhiyvggqyplssrapi.supabase.co/functions/v1/portal-login"
  status = 200
  force = true

[[redirects]]
  from = "/api/portal-invite"
  to = "https://lynzhiyvggqyplssrapi.supabase.co/functions/v1/portal-invite"
  status = 200
  force = true

# Previews are served by netlify/functions/preview.mjs, NOT by Supabase.
# Supabase deliberately refuses to serve HTML — the same bucket returns
# style.css as text/css and index.html as text/plain, so every page of a
# client's site rendered as visible source. Netlify has no such rule, and
# being on this origin means the portal's cookie simply arrives.
#
# The function declares its own `config.path`, so no redirect is needed here.
# Left as a comment rather than deleted, because the obvious fix when previews
# break is to add one back, and that would shadow the function.

# Nothing signed-in should ever be cached by a shared proxy.
[[headers]]
  for = "/portal/*"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex, nofollow"
