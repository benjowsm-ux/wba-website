name: Build feed

# Rebuilds the Feed pages from Supabase and injects the featured cards back
# into index.html and services.html. Fails soft: if Supabase is unreachable
# the script keeps the existing pages and exits 0, so a transient blip never
# turns the run red or blanks the site.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install renderer
        run: npm install --no-save marked@12

      - name: Generate Feed pages
        run: node scripts/build-feed.mjs

      - name: Commit changes
        run: |
          git config user.name "wba-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A feed feed.html blog blog.html sitemap.xml index.html services.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Rebuild Feed [skip ci]"
            git pull --rebase origin main
            git push
          fi
