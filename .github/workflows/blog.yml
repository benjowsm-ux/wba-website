name: Build blog

# Every 30 min: rebuilds Blog pages + Weston news from Supabase/Google News.
# Designed to never fail on transient errors — the script fails soft and
# keeps the last good pages, so no more error emails.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-blog
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install renderer
        run: npm install --no-save marked@12
      - name: Generate Blog pages + news feed
        run: node scripts/build-blog.mjs
      - name: Commit changes
        run: |
          git config user.name "wba-blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A blog.html sitemap.xml blog news.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Rebuild Blog + news [skip ci]"
            git pull --rebase origin main
            git push
          fi
