name: Build blog
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-blog
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install renderer
        run: npm install --no-save marked@12
      - name: Generate Blog pages
        run: |
          rm -rf blog
          node scripts/build-blog.mjs
      - name: Commit changes
        run: |
          git config user.name "wba-blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A blog.html sitemap.xml blog
          if git diff --cached --quiet; then
            echo "No Blog changes."
          else
            git commit -m "Rebuild Blog pages [skip ci]"
            git push
          fi
