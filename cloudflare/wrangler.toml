# Cloudflare Worker that serves client previews out of R2.
#   npx wrangler deploy
name = "wba-previews"
main = "preview-worker.js"
compatibility_date = "2026-08-01"

# The bucket. Create it once:  npx wrangler r2 bucket create wba-previews
[[r2_buckets]]
binding = "PREVIEWS"
bucket_name = "wba-previews"

# Previews are served from their OWN hostname, never the main site's. Same
# origin would let a preview page read the portal's localStorage — including
# the client's session token.
[[routes]]
pattern = "preview.westonbusinessauthority.co.uk/*"
zone_name = "westonbusinessauthority.co.uk"

# Secrets, set with `npx wrangler secret put NAME` — never in this file:
#   SUPABASE_URL       https://lynzhiyvggqyplssrapi.supabase.co
#   SUPABASE_ANON_KEY  the publishable key (public by design; RLS does the work)
